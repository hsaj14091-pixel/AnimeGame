<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>غرفة الانتظار</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg: #121212; --card: #1e1e2e; --accent: #f39c12; --otaku: #8e44ad; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; padding: 20px; }
        
        .container { max-width: 500px; margin: 50px auto; background: var(--card); padding: 30px; border-radius: 20px; }
        .player-item { background: #2c3e50; margin: 10px 0; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; }
        
        .start-btn { 
            background: linear-gradient(45deg, #27ae60, #2ecc71); 
            color: white; padding: 15px 40px; border: none; border-radius: 50px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%;
            display: none; /* مخفي افتراضياً */
        }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }
        
        .waiting-msg { color: #888; margin-top: 20px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>صالة التجهيز</h1>
        <p>رقم الغرفة: <span style="color:var(--accent)">{{ room_id }}</span></p>
        
        <div id="players-list"></div>
        
        <button id="start-btn" class="start-btn" onclick="startGame()">🚀 ابدأ التحدي!</button>
        <p id="wait-msg" class="waiting-msg">بانتظار المضيف ليبدأ اللعبة...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        const roomId = "{{ room_id }}";
        const isHost = sessionStorage.getItem('isHost') === 'true'; // هل أنا المضيف؟

        // طلب بيانات الغرفة الحالية عند التحميل
        socket.on('connect', () => {
             socket.emit('get_room_details', { roomId: roomId });
        });

        // تحديث قائمة اللاعبين
        socket.on('update_players_in_room', (players) => {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            players.forEach(p => {
                list.innerHTML += `<div class="player-item">👤 ${p.name} <span style="color:var(--accent)">${p.score} نقطة</span></div>`;
            });

            // لو أنا المضيف والعدد مناسب، أظهر زر البدء
            if (isHost) {
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('wait-msg').style.display = 'none';
            }
        });
        
        function startGame() {
            socket.emit('start_room_game', { roomId: roomId });
        }

        socket.on('game_started', () => {
            window.location.href = '/play?mode=random';
        });
    </script>
</body>
</html>
